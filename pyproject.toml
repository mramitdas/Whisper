[tool.ruff]
line-length = 100
target-version = "py312"
# legacy files removed in final task of the rewrite plan
extend-exclude = ["app.py", "database.py", "info.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
