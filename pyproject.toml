[tool.ruff]
line-length = 100
target-version = "py312"
# legacy files removed in final task of the rewrite plan
extend-exclude = ["app.py", "database.py", "info.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*slated for removal in Python 3.16:DeprecationWarning",
    "ignore:_restore_event_loop_policy:DeprecationWarning",
    "ignore:_save:DeprecationWarning",
    "ignore:There is no current event loop:DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

# redis-py's overloaded response types (decode_responses not a Literal) produce
# spurious "Awaitable | T" await errors at every call site; skip its stubs.
[[tool.mypy.overrides]]
module = ["redis.*", "fakeredis.*"]
follow_imports = "skip"
