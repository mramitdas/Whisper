[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "whisper-telegram"
version = "1.0.0"
description = "Omegle-style anonymous 1:1 stranger chat inside Telegram — aiogram 3, Redis, PostgreSQL, zero message retention."
readme = "readme.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Amit Das", email = "mramitdas99@gmail.com" }]
requires-python = ">=3.12"
keywords = ["telegram", "bot", "anonymous", "chat", "stranger", "aiogram", "redis"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
  "Typing :: Typed",
]
dependencies = [
  "aiogram>=3.13,<4",
  "redis>=5.2,<6",
  # the [asyncio] extra pulls in greenlet on every platform (SQLAlchemy only
  # declares it for x86_64/win32, which breaks Apple Silicon installs)
  "SQLAlchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<0.31",
  "alembic>=1.14,<1.15",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<0.26",
  "fakeredis>=2.26,<3",
  "aiosqlite>=0.20,<0.21",
  "ruff>=0.9,<0.10",
  "mypy>=1.14,<1.16",
  "lupa>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/mramitdas/Whisper"
Repository = "https://github.com/mramitdas/Whisper"
Issues = "https://github.com/mramitdas/Whisper/issues"
Changelog = "https://github.com/mramitdas/Whisper/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["whisper"]

[project.scripts]
whisper = "whisper.main:run"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*slated for removal in Python 3.16:DeprecationWarning",
    "ignore:_restore_event_loop_policy:DeprecationWarning",
    "ignore:_save:DeprecationWarning",
    "ignore:There is no current event loop:DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

# redis-py's overloaded response types (decode_responses not a Literal) produce
# spurious "Awaitable | T" await errors at every call site; skip its stubs.
[[tool.mypy.overrides]]
module = ["redis.*", "fakeredis.*"]
follow_imports = "skip"
